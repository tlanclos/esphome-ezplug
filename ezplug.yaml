substitutions:
  name: !secret name
  friendly_name: !secret friendly_name

api:
  encryption:
    # Generate using the generator at https://esphome.io/components/api/
    key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name}"
    password: !secret fallback_ap_password

  output_power: 8.5

<<: !include esp32-logging.yaml
<<: !include ezplug-common.yaml
<<: !include esp32-bluetooth.yaml
